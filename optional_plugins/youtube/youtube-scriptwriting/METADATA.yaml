skill_id: youtube-scriptwriting
name: youtube-scriptwriting
description: Use this skill whenever you are writing or expanding a YouTube script
  from an outline. It enforces Audio/Visual (A/V) formatting standards, active voice,
  and conversational tone designed for the spoken word. Trigger when the scribe is
  executing the /script command or when a user asks to "write a script for X." Do
  NOT use for script auditing (retention checks); use youtube-retention for that review
  phase.
version: 1.0.1
tags:
- youtube
- scriptwriting
- storytelling
- creative-writing
- production
auto_activate: false
compatibility:
  min_os_version: 2.5.0
  max_os_version: null
