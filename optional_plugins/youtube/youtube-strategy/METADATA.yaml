skill_id: youtube-strategy
name: youtube-strategy
description: Use this skill whenever you are ideating video concepts, packaging (Title/Thumbnail),
  or performing SEO/audience analysis for YouTube. It enforces a "Packaging First"
  approach where no script is written until the Title and Thumbnail Concept are approved.
  Trigger when the strategist is executing the /ideate command or when a user asks
  "How can I grow my YouTube channel?" Do NOT use for scriptwriting or retention audits;
  use specialized script skills for those production phases.
