description: Expert in building, debugging, and reviewing Model Context Protocol (MCP)
  servers using Python. This skill enforces the use of FastMCP and Pydantic v2 for
  high-performance, type-safe agent tool orchestration. Use this skill whenever you
  are designing a new MCP server, adding tools to an existing one, or troubleshooting
  JSON-RPC communication issues in a Python environment. Trigger when the user mentions
  'Python MCP', 'FastMCP', or asks to 'build a tool' for a specific API. Do NOT use
  this skill for general Python development without an MCP component or for TypeScript-based
  MCP servers.
