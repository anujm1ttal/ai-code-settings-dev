skill_id: rhino-e2e-testing
name: rhino-e2e-testing
description: Use this skill whenever you are performing rigorous, headless end-to-end
  testing of RhinoCommon geometry, Grasshopper definitions, or plugin state using
  Rhino.Inside and pytest. It implements the "Lane A protocol" for verifying geometric
  invariants like manifoldness, intersections, and tolerance-aware comparisons. Trigger
  when you are fixing a geometric bug, adding a new Grasshopper component, or verifying
  a complex Brep operation. Do NOT use for geometry-agnostic logic that can be tested
  in pure Python (Lane B); use rhino-unit-testing instead.
version: 1.0.1
tags:
- rhino
- grasshopper
- testing
- pytest
- rhinoinside
- e2e
auto_activate: false
compatibility:
  min_os_version: 2.5.0
  max_os_version: null
