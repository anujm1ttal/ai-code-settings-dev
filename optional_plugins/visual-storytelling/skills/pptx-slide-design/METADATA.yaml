skill_id: pptx-slide-design
name: pptx-slide-design
description: >-
  Use this skill whenever the user needs to design individual slides for
  PowerPoint using Copilot Premium (Opus model). It generates copy-paste-ready
  prompts that Copilot can execute directly inside PowerPoint to render
  beautifully designed slides. Trigger when a user has a LAYOUT_SPEC.md or
  mentions designing/building presentation slides. Do NOT use for authoring
  presentation content or generating .pptx files directly — those require
  separate tools. This skill emits PROMPTS ONLY.
version: 1.0.0
tags: []
auto_activate: false
compatibility:
  min_os_version: 2.5.0
  max_os_version: null
