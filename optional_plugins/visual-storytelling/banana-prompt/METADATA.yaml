skill_id: banana-prompt
name: banana-prompt
description: >-
  Use this skill whenever the user needs high-quality AI image prompts for
  Midjourney, Gemini, DALL-E, or other image generation models. It
  specializes in converting vague visual concepts into precise, structured
  prompts that include lighting, camera settings, art styles, and technical
  parameters. Trigger when the creative-director is planning a deck, when
  thumbnails are being designed, or when a user asks "Give me an image of X."
  Do NOT use for basic text generation or general chat without a visual
  production requirement.
version: 1.0.0
tags: []
auto_activate: false
compatibility:
  min_os_version: 2.5.0
  max_os_version: null
